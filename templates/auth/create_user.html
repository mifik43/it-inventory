{% extends "base/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">Создание пользователя</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <!-- Левая колонка - основная форма -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя *</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль *</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <div class="form-text">Пароль должен быть не менее 6 символов</div>
                            </div>
                            
                            

                            <div class="mb-3">
                                <label for="organization_id" class="form-label">Организация</label>
                                <select class="form-select" id="organization_id" name="organization_id">
                                    <option value="">Без организации</option>
                                    {% for org in organizations %}
                                    <option value="{{ org.id }}">{{ org.name }}</option>
                                    {% endfor %}
                                </select>
                                <div class="form-text">Выберите организацию, к которой будет привязан пользователь.</div>
                            </div>
                            
                            <div class="btn-group" role="group">
                                <button type="submit" class="btn btn-primary">Сохранить</button>
                                <a href="{{ url_for('users.admin_panel') }}" class="btn btn-outline-secondary">Отмена</a>
                            </div>
                        </div>

                        <!-- Правая колонка - роли с прокруткой -->
                        <div class="col-md-6">
                            {% include "auth/roles.html" %}
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% include "auth/roles_styles.html" %}
{% endblock %}
