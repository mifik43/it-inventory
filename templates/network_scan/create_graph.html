{% extends "base/base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header">
                    <h4 class="mb-0">Создание графа</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('network_scan.create_graph') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Название графа *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="organization_id" class="form-label">Организация</label>
                            <select class="form-select" id="organization_id" name="organization_id">
                                <option value="">Без организации</option>
                                {% for org in organizations %}
                                <option value="{{ org.id }}">{{ org.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Описание</label>
                            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Создать</button>
                        <a href="{{ url_for('network_scan.graph_list') }}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
